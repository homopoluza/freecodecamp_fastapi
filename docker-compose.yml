name: ''
services:
  postgres:
    image: postgres
    container_name: postgres
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"        # expose PostgreSQL on localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    environment:
      - TZ=Asia/Almaty
    networks:
      - internal_net

  fastapi:
    build: .
    env_file:
      - .env
    container_name: fastapi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

networks:
  internal_net:

volumes:
  postgres_data: